name: Auditoria, avaliacao exploratoria e benchmark

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-amostra:
    name: Auditoria estatica de anotacoes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar imagens, coordenadas e splits
        run: python auditar_dataset.py --output runs/auditoria_dataset.json
      - name: Armazenar auditoria
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-dataset-amostra
          path: runs/auditoria_dataset.json
          retention-days: 14

  avaliar-checkpoint:
    name: Metricas e latencia (amostra de 10 imagens, CPU)
    needs: validar-amostra
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar PyTorch CPU
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Instalar inferencia
        run: python -m pip install -r requirements-avaliacao.txt
      - name: Avaliar amostra e medir latencia
        run: >-
          python avaliar_modelo.py
          --dataset dataset_amostra
          --model modelo/best.pt
          --output runs/avaliacao_amostra
          --device cpu
          --warmup 2
          --repeats 10
      - name: Verificar integridade dos relatórios
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import json

          root = Path("runs/avaliacao_amostra")
          audit = json.loads((root / "auditoria_dataset.json").read_text(encoding="utf-8"))
          metricas = json.loads((root / "metricas_amostra.json").read_text(encoding="utf-8"))
          bench = json.loads((root / "benchmark.json").read_text(encoding="utf-8"))
          with (root / "erros.csv").open(encoding="utf-8-sig", newline="") as f:
              erros = list(csv.DictReader(f))

          assert audit["aprovado"] is True
          assert audit["divisoes"]["test"]["imagens"] == 10
          assert metricas["metadados"]["amostra_imagens_teste"] == 10
          assert metricas["diagnostico_operacional"]["total_erros"] == len(erros)
          assert bench["repeticoes"] == 10
          assert bench["latencia_ms"]["media"] > 0
          assert all(0 <= value <= 1 for value in metricas["metricas_ultralytics_amostra"]["geral"].values())
          print("Auditoria e relatórios válidos: 10 imagens, JSON/CSV e latência registrada")
          PY
      - name: Registrar ambiente resolvido
        run: python -m pip freeze > runs/avaliacao_amostra/dependencias_resolvidas.txt
      - name: Resumo da execução
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          p = Path("runs/avaliacao_amostra")
          r = json.loads((p / "metricas_amostra.json").read_text(encoding="utf-8"))
          b = json.loads((p / "benchmark.json").read_text(encoding="utf-8"))
          m = r["metricas_ultralytics_amostra"]["geral"]
          texto = (
              "## Avaliação exploratória — 10 imagens, não dataset completo\n\n"
              f"- mAP@0.5 da amostra: {m['map50']:.4f}\n"
              f"- mAP@0.5:0.95 da amostra: {m['map50_95']:.4f}\n"
              f"- Precision/Recall médios da amostra: {m['precision']:.4f} / {m['recall']:.4f}\n"
              f"- Diagnóstico de erros (IoU 0.5): {r['diagnostico_operacional']['total_erros']}\n"
              f"- Latência média CI CPU: {b['latencia_ms']['media']:.2f} ms/imagem\n\n"
              "**Esses números não validam as métricas originais nem generalização.**\n"
          )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8").write(texto)
          print(texto)
          PY
      - name: Publicar relatórios reproduzíveis
        uses: actions/upload-artifact@v4
        with:
          name: avaliacao-exploratoria-yolov8
          path: runs/avaliacao_amostra/
          retention-days: 14
          if-no-files-found: error
